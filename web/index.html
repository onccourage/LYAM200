<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CQA — качество диалогов</title>
  <link rel="stylesheet" href="css/styles.css">
  <script>
    // Настройка для встраивания (например, HTML web resource в Dynamics 365):
    // window.CQA_CONFIG = { API_BASE_URL: "https://cqa.example.com" };
    // либо query-параметр ?api=https://cqa.example.com
    try { var t = localStorage.getItem("cqa.theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/">CQA <span>оценка качества диалогов</span></a>
    <nav class="nav" id="nav"></nav>
    <div class="topbar-right">
      <span class="model-info" id="model-info"></span>
      <button class="btn btn-sm" id="theme-toggle" type="button" title="Светлая / тёмная тема">Тема</button>
    </div>
  </header>
  <main id="view" class="view"></main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
