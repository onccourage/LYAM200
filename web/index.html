<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CQA — качество диалогов</title>
  <link rel="stylesheet" href="css/styles.css">
  <script>
    // Настройка для встраивания (например, HTML web resource в Dynamics 365):
    // window.CQA_CONFIG = { API_BASE_URL: "https://cqa.example.com" };
    // либо query-параметр ?api=https://cqa.example.com
    try { var t = localStorage.getItem("cqa.theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/">
      <svg class="brand-mark" viewBox="0 0 28 28" width="28" height="28" aria-hidden="true">
        <rect x="0" y="0" width="28" height="28" rx="7" fill="currentColor"></rect>
        <polyline points="7 14 12 19 21 8" fill="none" stroke="white" stroke-width="2.5"
          stroke-linecap="round" stroke-linejoin="round"></polyline>
      </svg>
      <span class="brand-text">CQA<span class="brand-sub">оценка качества диалогов</span></span>
    </a>
    <nav class="nav" id="nav"></nav>
    <div class="topbar-right">
      <div class="role-switch" id="role-switch" role="group" aria-label="Роль"></div>
      <span class="model-info" id="model-info"></span>
      <button class="btn btn-sm btn-icon-only" id="theme-toggle" type="button" title="Светлая / тёмная тема">
        <span class="visually-hidden">Светлая / тёмная тема</span>
      </button>
    </div>
  </header>
  <main id="view" class="view"></main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
